services:
  api:
    build:
      context: . # 当前目录（即 saleor 目录）
      dockerfile: Dockerfile
    pull_policy: build
    command: ["uvicorn", "saleor.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/app # 挂载当前目录（即 saleor 源码）到容器的 /app
    env_file:
      - ./.env # 当前目录下的 .env 文件
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    command: ["celery", "--app", "saleor.celeryconf:app", "worker", "-E", "--loglevel=info"]
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    command: ["celery", "--app", "saleor.celeryconf:app", "beat", "--scheduler", "saleor.schedulers.schedulers.DatabaseScheduler"]
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=saleor
      - POSTGRES_DB=saleor
    volumes:
      - saleor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - saleor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  saleor_db_data:
  saleor_redis_data:
